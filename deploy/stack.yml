# Stack do LandMass para Docker Swarm. Procedimento completo: docs/operations/production.md.
#
# Antes de subir:
#   printf '%s' 'sqlite+aiosqlite:////app/data/landmass.db' | docker secret create landmass_database_url -
#   export LANDMASS_PUBLIC_HOST=<IP que os clientes alcançam>
#   export LANDMASS_GAME_HOST=<IP ou nome do host Windows com o LandMass.exe>
#   docker stack deploy -c deploy/stack.yml landmass
#
# Um réplica só: as salas e o lobby ficam na memória do processo. Não escale.
services:
  landmass:
    image: landmass-emu:latest # build local: docker build -t landmass-emu:latest .
    environment:
      # IP anunciado aos clientes na lista de canais. Sem ele, o cliente tenta 127.0.0.1.
      LANDMASS_PUBLIC_HOST: ${LANDMASS_PUBLIC_HOST:?defina o IP público anunciado aos clientes}
      LANDMASS_DATABASE_URL_FILE: /run/secrets/landmass_database_url
      LANDMASS_LOG_LEVEL: INFO
      LANDMASS_LOG_JSON: "true"
      # Prazo do desligamento. O stop_grace_period abaixo tem que passar disto (300 + 8 s de
      # partida + margem); se mudar aqui, mude lá.
      LANDMASS_SHUTDOWN_GRACE_SECONDS: "300"
      # Sem LANDMASS_MATCH_SERVER_DIR: a partida é o endereço fixo do LandMass.exe, que roda em
      # Windows fora deste container. Os clientes recebem este endereço no 403
      # (docs/operations/production.md).
      LANDMASS_GAME_HOST: ${LANDMASS_GAME_HOST:?defina o endereço do host Windows com o LandMass.exe}
      LANDMASS_GAME_PORT: "7777"
    secrets:
      - landmass_database_url
    volumes:
      - landmass-data:/app/data
    # Sintaxe curta: modo ingress (routing mesh), então qualquer IP do cluster atende as portas.
    ports:
      - "7313:7313/tcp" # Message
      - "7314:7314/tcp" # Channel
      # Faixa UDP do servidor de partida (LandMass.exe). Só é usada com
      # LANDMASS_MATCH_SERVER_DIR, que não existe neste container Linux; publicada para o caso de
      # o servidor de partida estar no mesmo cluster.
      - "7800-7899:7800-7899/udp"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/landmass-emu", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Tempo que o Swarm espera depois do SIGTERM antes do SIGKILL. Precisa passar do prazo do
    # desligamento: 300 s de prazo, 8 s de parada de partida e margem para gravar o banco.
    stop_grace_period: 6m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      # on-failure: uma parada pedida (landmass-emu shutdown, SIGTERM) sai com 0 e não é
      # reiniciada. Para voltar: docker service update --force landmass_landmass.
      restart_policy:
        condition: on-failure
      update_config:
        # Para a versão antiga antes de subir a nova: duas instâncias não podem usar o mesmo banco.
        order: stop-first
        parallelism: 1
        failure_action: rollback

secrets:
  landmass_database_url:
    external: true

volumes:
  landmass-data:

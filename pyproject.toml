[project]
name = "landmass-emu"
version = "0.1.0"
description = "Emulador do servidor LandMass"
readme = "README.md"
authors = [
    { name = "Érycson Nóbrega", email = "egdn2004@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
landmass-emu = "landmass_emu.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.13", "mypy>=1.18"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
per-file-ignores = { "tests/*" = ["ASYNC240"] }

[tool.mypy]
strict = true
